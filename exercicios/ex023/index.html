<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Tabelas em Html</title>
</head>
<body>
    <h1>Minha primeira tabela</h1>
    <!--
    Hierarquia de Tabelas (simples)
    table = tabela
        table row = linhas 
            table header = cabeçalho
                table data = dados

    -->
    <table>
        <tr>
            <th>Id</th>
            <th>Nome</th>
            <th>Cidade</th>
        </tr>
        <tr>
            <td>1</td>
            <td>Gabriell</td>
            <td>Caruaru</td>
        </tr>
        <tr>
            <td>2</td>
            <td>Adrielly</td>
            <td>Itaquera</td>
        </tr>
    </table>
    
</body>
</html>
